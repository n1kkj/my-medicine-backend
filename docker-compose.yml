services:
  web:
    build: .
    ports:
      - "8080:80"
    env_file: .env
    volumes:
      - .:/web_app
    networks:
      - database_network

  db:
    image: postgres:14.5
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - database_network
    restart: unless-stopped

volumes:
  postgres_data:
networks:
  database_network: