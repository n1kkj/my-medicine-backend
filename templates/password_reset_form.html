<!DOCTYPE html>
<html>
<head>
    <title>Сброс пароля</title>
    <style>
        .container { max-width: 500px; margin: 50px auto; }
        .error { color: red; }
        .form-group { margin-bottom: 15px; }
    </style>
</head>
<body>
    <div class="container">
        {% if valid_link %}
            <h2>Введите новый пароль</h2>
            <form id="passwordResetForm">
                <input type="hidden" id="uidb64" value="{{ uidb64 }}">
                <input type="hidden" id="token" value="{{ token }}">

                <div class="form-group">
                    <label for="password">Новый пароль:</label>
                    <input type="password" id="password" required>
                </div>

                <div class="form-group">
                    <label for="confirm_password">Подтвердите пароль:</label>
                    <input type="password" id="confirm_password" required>
                </div>

                <button type="submit">Сохранить</button>
            </form>

            <div id="message" style="margin-top: 20px;"></div>

            <script>
                document.getElementById('passwordResetForm').addEventListener('submit', async function(e) {
                    e.preventDefault();

                    const password = document.getElementById('password').value;
                    const confirmPassword = document.getElementById('confirm_password').value;

                    if (password !== confirmPassword) {
                        document.getElementById('message').innerHTML =
                            '<p class="error">Пароли не совпадают</p>';
                        return;
                    }

                    const response = await fetch('/api/auth/reset-password/{{ uidb64 }}/{{ token }}/', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'X-CSRFToken': '{{ csrf_token }}'
                        },
                        body: JSON.stringify({
                            password: password,
                            confirm_password: confirmPassword
                        })
                    });

                    const result = await response.json();

                    if (response.ok) {
                        document.getElementById('message').innerHTML =
                            '<p style="color: green;">Пароль успешно изменен!</p>';
                        document.getElementById('passwordResetForm').style.display = 'none';
                    } else {
                        document.getElementById('message').innerHTML =
                            `<p class="error">${result.error || 'Ошибка при сбросе пароля'}</p>`;
                    }
                });
            </script>
        {% else %}
            <h2 class="error">Ошибка</h2>
            <p>{{ error }}</p>
        {% endif %}
    </div>
</body>
</html>
